<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Logan 语录 · Gemini 负责人发言集</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card-hover: #22263a;
  --text: #e8eaf0;
  --muted: #9aa0b0;
  --accent: #7c8cf8;
  --border: #2a2e3d;
  --meme: #f59e0b;
  --jiahao: #34d399;
  --work: #60a5fa;
  --boring: #9ca3af;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  min-height: 100vh;
}
header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(15,17,23,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
}
.header-inner { max-width: 1080px; margin: 0 auto; }
h1 { font-size: 20px; letter-spacing: .5px; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.search-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; align-items: center; }
#search {
  flex: 1; min-width: 220px;
  background: var(--card); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px;
  padding: 10px 14px; font-size: 15px; outline: none;
}
#search:focus { border-color: var(--accent); }
#search::placeholder { color: var(--muted); }
.cat-tabs { display: flex; gap: 8px; flex-wrap: wrap; }
.cat-btn {
  background: var(--card); color: var(--muted);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 16px; font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.cat-btn:hover { color: var(--text); border-color: var(--accent); }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { max-width: 1080px; margin: 0 auto; padding: 20px 24px 60px; }
.stats { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 14px;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; overflow: hidden; cursor: pointer;
  transition: transform .15s, background .15s;
  display: flex; flex-direction: column;
}
.card:hover { transform: translateY(-3px); background: var(--card-hover); }
.card img {
  width: 100%; aspect-ratio: 4/3; object-fit: cover;
  background: #000; display: block;
}
.card .info { padding: 10px 12px; }
.card .name {
  font-size: 13px; line-height: 1.5; display: -webkit-box;
  -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.badge {
  display: inline-block; font-size: 11px; border-radius: 4px;
  padding: 1px 7px; margin-bottom: 6px;
}
.badge.meme { background: rgba(245,158,11,.15); color: var(--meme); }
.badge.jiahao { background: rgba(52,211,153,.15); color: var(--jiahao); }
.badge.work { background: rgba(96,165,250,.15); color: var(--work); }
.badge.boring { background: rgba(156,163,175,.15); color: var(--boring); }
.empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 15px; }
#lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.88); z-index: 100;
  display: none; align-items: center; justify-content: center; flex-direction: column;
  padding: 30px;
}
#lightbox.open { display: flex; }
#lightbox img { max-width: min(92vw, 1000px); max-height: 78vh; border-radius: 8px; }
#lightbox .lb-name { margin-top: 14px; font-size: 14px; color: var(--text); text-align: center; max-width: 800px; }
#lightbox .lb-cat { margin-top: 8px; font-size: 12px; color: var(--muted); }
#lb-close {
  position: absolute; top: 18px; right: 24px; font-size: 30px; color: #fff;
  cursor: pointer; background: none; border: none; line-height: 1;
}
#lb-close:hover { color: var(--accent); }
.hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
.hint kbd {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 4px; padding: 1px 6px; font-family: inherit;
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>Logan <span>语录</span> · Gemini 负责人发言集</h1>
    <div class="sub">共 <b id="total"></b> 条 · 支持模糊搜索，中英文符号通用（：与 : 等同）</div>
    <div class="search-row">
      <input id="search" type="text" placeholder="搜索关键词，如：模型 / 未来 / 谢谢 / 下个月..." autocomplete="off">
      <div class="cat-tabs">
        <button class="cat-btn active" data-cat="all">全部</button>
        <button class="cat-btn" data-cat="斗图">斗图</button>
        <button class="cat-btn" data-cat="嘉豪">嘉豪</button>
        <button class="cat-btn" data-cat="工作">工作</button>
        <button class="cat-btn" data-cat="无意义">无意义</button>
      </div>
    </div>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none">没有找到匹配的内容，换个关键词试试</div>
</main>
<div id="lightbox">
  <button id="lb-close">×</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-name" id="lb-name"></div>
  <div class="lb-cat" id="lb-cat"></div>
  <div class="hint">点击任意处关闭 · 按 <kbd>Esc</kbd> 关闭</div>
</div>
<script>
const SYMBOL_MAP = {'：':':','；':';','，':',','。':'.','！':'!','？':'?','（':'(','）':')','“':'"','”':'"','‘':"'",'’':"'",'【':'[','】':']','、':' '};
const norm = s => Array.from(s).map(c => SYMBOL_MAP[c] || c).join('').toLowerCase();
const CAT_COLORS = { '斗图':'meme', '嘉豪':'jiahao', '工作':'work', '无意义':'boring' };

let ALL = [];
let state = { cat: 'all', q: '' };

fetch('data.json').then(r => r.json()).then(data => {
  ALL = data;
  document.getElementById('total').textContent = ALL.length;
  render();
}).catch(() => {
  document.getElementById('empty').style.display = 'block';
  document.getElementById('empty').textContent = '数据加载失败，请确认 data.json 存在';
});

document.getElementById('search').addEventListener('input', e => {
  state.q = e.target.value.trim();
  render();
});
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    render();
  });
});

function filterList() {
  const q = norm(state.q);
  return ALL.filter(item => {
    if (state.cat !== 'all' && item.cat !== state.cat) return false;
    if (!q) return true;
    return norm(item.norm).includes(q) || norm(item.name).includes(q);
  });
}

function render() {
  const list = filterList();
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  document.getElementById('empty').style.display = list.length ? 'none' : 'block';
  document.getElementById('stats').textContent =
    `显示 ${list.length} / ${ALL.length} 条` + (state.q ? ` · 关键词「${state.q}」` : '');
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <img loading="lazy" src="${item.path}" alt="${item.name}">
      <div class="info">
        <span class="badge ${CAT_COLORS[item.cat]}">${item.cat}</span>
        <div class="name">${item.name}</div>
      </div>`;
    card.addEventListener('click', () => openLightbox(item));
    grid.appendChild(card);
  });
}

const lb = document.getElementById('lightbox');
function openLightbox(item) {
  document.getElementById('lb-img').src = item.path;
  document.getElementById('lb-name').textContent = item.name;
  document.getElementById('lb-cat').textContent = `分类：${item.cat} · 文件名：${item.file}`;
  lb.classList.add('open');
}
function closeLightbox() { lb.classList.remove('open'); }
lb.addEventListener('click', closeLightbox);
document.getElementById('lb-img').addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
