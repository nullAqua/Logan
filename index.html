<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这就是Logan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
:root {
  --bg: #ffffff;
  --ink: #000000;
  --gray: #767676;
  --border: #000000;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  display: flex; flex-direction: column;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.hero {
  padding: 76px 24px 44px;
  text-align: center;
}
.hero h1 {
  font-size: clamp(46px, 8vw, 80px);
  font-weight: 900;
  letter-spacing: 8px;
  margin-bottom: 34px;
  user-select: none;
}
.search-row {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  gap: 0;
  align-items: stretch;
  border: 2px solid var(--border);
}
#random-btn {
  flex-shrink: 0;
  width: 58px;
  border: none;
  border-right: 2px solid var(--border);
  background: var(--bg);
  color: var(--ink);
  font-size: 24px;
  cursor: pointer;
  transition: background .12s, color .12s;
}
#random-btn:hover { background: var(--ink); }
#search {
  flex: 1;
  border: none;
  background: var(--bg);
  color: var(--ink);
  padding: 16px 24px;
  font-size: 18px;
  outline: none;
  font-family: inherit;
}
#search::placeholder { color: var(--gray); }
main { flex: 1; max-width: 1080px; margin: 0 auto; padding: 24px 24px 64px; width: 100%; }
.stats { font-size: 14px; font-weight: 700; margin-bottom: 18px; border-bottom: 2px solid var(--border); padding-bottom: 10px; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 4px;
}
.card {
  background: var(--bg);
  border: 2px solid var(--border);
  cursor: pointer;
  transition: background .12s;
}
.card:hover { background: var(--ink); }
.card img {
  width: 100%; display: block; background: #000;
}
.empty {
  color: var(--gray); text-align: center;
  padding: 80px 0; font-size: 16px;
}
#lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 100;
  display: none; align-items: center; justify-content: center; flex-direction: column;
  padding: 30px;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: min(94vw, 1100px); max-height: 80vh;
  width: auto; height: auto; border: 2px solid var(--bg); background: #000;
}
#lightbox .lb-name { margin-top: 16px; font-size: 15px; color: #fff; text-align: center; max-width: 800px; }
#lightbox .lb-hint { margin-top: 8px; font-size: 12px; color: #9aa; }
#lb-close {
  position: absolute; top: 18px; right: 24px; font-size: 32px; color: #fff;
  cursor: pointer; background: none; border: none; line-height: 1;
}
#lb-close:hover { color: #000; background: #fff; }
</style>
</head>
<body>
<div class="hero">
  <h1>这就是Logan</h1>
  <div class="search-row">
    <button id="random-btn" title="随机来一张">🎲</button>
    <input id="search" type="text" placeholder="搜索关键词，如：模型 / 未来 / 谢谢 / 下个月..." autocomplete="off">
  </div>
</div>
<main>
  <div class="stats" id="stats" style="display:none"></div>
  <div class="grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty"></div>
</main>
<div id="lightbox">
  <button id="lb-close">×</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-name" id="lb-name"></div>
  <div class="lb-hint">点击任意处或按 Esc 关闭</div>
</div>
<script>
const SYMBOL_MAP = {'：':':','；':';','，':',','。':'.','！':'!','？':'?','（':'(','）':')','“':'"','”':'"','‘':"'",'’':"'",'【':'[','】':']','、':' '};
const norm = s => Array.from(s).map(c => SYMBOL_MAP[c] || c).join('').toLowerCase();

let ALL = [];
let state = { q: '' };

const $ = id => document.getElementById(id);

fetch('data.json').then(r => r.json()).then(data => {
  ALL = data;
  $('empty').textContent = '输入关键词开始搜索';
  $('empty').style.display = 'block';
}).catch(() => {
  $('empty').textContent = '数据加载失败，请确认 data.json 存在';
  $('empty').style.display = 'block';
});

$('search').addEventListener('input', e => {
  state.q = e.target.value.trim();
  render();
});
$('random-btn').addEventListener('click', rollRandom);

function filtered() {
  const q = norm(state.q);
  if (!q) return [];
  return ALL.filter(item => norm(item.norm).includes(q) || norm(item.name).includes(q));
}

function render() {
  if (!state.q) {
    $('grid').style.display = 'none';
    $('stats').style.display = 'none';
    $('empty').textContent = '输入关键词开始搜索';
    $('empty').style.display = 'block';
    return;
  }
  const list = filtered();
  $('empty').style.display = list.length ? 'none' : 'block';
  $('empty').textContent = list.length ? '' : '没有找到匹配的内容，换个关键词试试';
  $('grid').style.display = list.length ? 'grid' : 'none';
  $('stats').style.display = list.length ? 'block' : 'none';
  $('stats').textContent = `找到 ${list.length} 条`;
  const grid = $('grid');
  grid.innerHTML = '';
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = item.path;
    img.alt = item.name;
    card.appendChild(img);
    card.addEventListener('click', () => openLightbox(item));
    grid.appendChild(card);
  });
}

function rollRandom() {
  if (!ALL.length) return;
  const item = ALL[Math.floor(Math.random() * ALL.length)];
  openLightbox(item);
}

const lb = $('lightbox');
function openLightbox(item) {
  $('lb-img').src = item.path;
  $('lb-name').textContent = item.name;
  lb.classList.add('open');
}
function closeLightbox() { lb.classList.remove('open'); }
lb.addEventListener('click', closeLightbox);
$('lb-img').addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
