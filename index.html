<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这就是Logan</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💬</text></svg>">
<style>
:root {
  --bg: #0b0d12;
  --card: #141824;
  --text: #eef0f6;
  --muted: #8b91a5;
  --accent: #7c8cf8;
  --border: #222839;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  display: flex; flex-direction: column;
  min-height: 100vh;
}
.hero {
  padding: 72px 24px 40px;
  text-align: center;
}
.hero h1 {
  font-size: clamp(44px, 8vw, 76px);
  font-weight: 800;
  letter-spacing: 6px;
  background: linear-gradient(135deg, #fff 0%, var(--accent) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 28px;
  user-select: none;
}
.search-row {
  max-width: 720px;
  margin: 0 auto;
  display: flex;
  gap: 12px;
  align-items: center;
}
#random-btn {
  flex-shrink: 0;
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  font-size: 22px;
  cursor: pointer;
  transition: transform .2s, border-color .2s, box-shadow .2s;
  line-height: 1;
}
#random-btn:hover {
  border-color: var(--accent);
  transform: rotate(15deg) scale(1.05);
  box-shadow: 0 0 24px rgba(124,140,248,.25);
}
#search {
  flex: 1;
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 26px;
  padding: 15px 26px;
  font-size: 17px;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
#search:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 4px rgba(124,140,248,.12);
}
#search::placeholder { color: var(--muted); }
.cat-tabs {
  max-width: 720px; margin: 18px auto 0;
  display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
}
.cat-btn {
  background: transparent; color: var(--muted);
  border: 1px solid var(--border); border-radius: 20px;
  padding: 7px 18px; font-size: 13px; cursor: pointer;
  transition: all .15s;
}
.cat-btn:hover { color: var(--text); border-color: var(--accent); }
.cat-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
main { flex: 1; max-width: 1080px; margin: 0 auto; padding: 24px 24px 60px; width: 100%; }
.stats { color: var(--muted); font-size: 13px; margin-bottom: 16px; }
.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 18px;
}
.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; overflow: hidden; cursor: pointer;
  transition: transform .18s, border-color .18s;
}
.card:hover { transform: translateY(-4px); border-color: var(--accent); }
.card img {
  width: 100%; display: block; background: #000;
}
.empty {
  color: var(--muted); text-align: center;
  padding: 80px 0; font-size: 15px;
}
#lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,.9); z-index: 100;
  display: none; align-items: center; justify-content: center; flex-direction: column;
  padding: 30px;
}
#lightbox.open { display: flex; }
#lightbox img {
  max-width: min(94vw, 1100px); max-height: 80vh;
  width: auto; height: auto; border-radius: 8px; background: #000;
}
#lightbox .lb-name { margin-top: 14px; font-size: 14px; color: var(--text); text-align: center; max-width: 800px; }
#lightbox .lb-hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
#lb-close {
  position: absolute; top: 18px; right: 24px; font-size: 32px; color: #fff;
  cursor: pointer; background: none; border: none; line-height: 1;
}
#lb-close:hover { color: var(--accent); }
</style>
</head>
<body>
<div class="hero">
  <h1>这就是Logan</h1>
  <div class="search-row">
    <button id="random-btn" title="随机来一张">🎲</button>
    <input id="search" type="text" placeholder="搜索关键词，如：模型 / 未来 / 谢谢 / 下个月..." autocomplete="off">
  </div>
  <div class="cat-tabs">
    <button class="cat-btn active" data-cat="all">全部</button>
    <button class="cat-btn" data-cat="斗图">斗图</button>
    <button class="cat-btn" data-cat="嘉豪">嘉豪</button>
    <button class="cat-btn" data-cat="工作">工作</button>
    <button class="cat-btn" data-cat="无意义">无意义</button>
  </div>
</div>
<main>
  <div class="stats" id="stats" style="display:none"></div>
  <div class="grid" id="grid" style="display:none"></div>
  <div class="empty" id="empty"></div>
</main>
<div id="lightbox">
  <button id="lb-close">×</button>
  <img id="lb-img" src="" alt="">
  <div class="lb-name" id="lb-name"></div>
  <div class="lb-hint">点击任意处或按 Esc 关闭</div>
</div>
<script>
const SYMBOL_MAP = {'：':':','；':';','，':',','。':'.','！':'!','？':'?','（':'(','）':')','“':'"','”':'"','‘':"'",'’':"'",'【':'[','】':']','、':' '};
const norm = s => Array.from(s).map(c => SYMBOL_MAP[c] || c).join('').toLowerCase();

let ALL = [];
let state = { cat: 'all', q: '' };

const $ = id => document.getElementById(id);

fetch('data.json').then(r => r.json()).then(data => {
  ALL = data;
  $('empty').textContent = '输入关键词开始搜索';
  $('empty').style.display = 'block';
}).catch(() => {
  $('empty').textContent = '数据加载失败，请确认 data.json 存在';
  $('empty').style.display = 'block';
});

$('search').addEventListener('input', e => {
  state.q = e.target.value.trim();
  render();
});
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    state.cat = btn.dataset.cat;
    if (state.q) render();
  });
});
$('random-btn').addEventListener('click', rollRandom);

function filtered() {
  const q = norm(state.q);
  return ALL.filter(item => {
    if (state.cat !== 'all' && item.cat !== state.cat) return false;
    if (!q) return true;
    return norm(item.norm).includes(q) || norm(item.name).includes(q);
  });
}

function render() {
  if (!state.q) {
    $('grid').style.display = 'none';
    $('stats').style.display = 'none';
    $('empty').textContent = '输入关键词开始搜索';
    $('empty').style.display = 'block';
    return;
  }
  const list = filtered();
  $('empty').style.display = list.length ? 'none' : 'block';
  $('empty').textContent = list.length ? '' : '没有找到匹配的内容，换个关键词试试';
  $('grid').style.display = list.length ? 'grid' : 'none';
  $('stats').style.display = list.length ? 'block' : 'none';
  $('stats').textContent = `找到 ${list.length} 条`;
  const grid = $('grid');
  grid.innerHTML = '';
  list.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';
    const img = document.createElement('img');
    img.loading = 'lazy';
    img.src = item.path;
    img.alt = item.name;
    card.appendChild(img);
    card.addEventListener('click', () => openLightbox(item));
    grid.appendChild(card);
  });
}

function rollRandom() {
  const list = state.q ? filtered() : (state.cat === 'all' ? ALL : ALL.filter(i => i.cat === state.cat));
  if (!list.length) return;
  const item = list[Math.floor(Math.random() * list.length)];
  openLightbox(item);
}

const lb = $('lightbox');
function openLightbox(item) {
  $('lb-img').src = item.path;
  $('lb-name').textContent = item.name;
  lb.classList.add('open');
}
function closeLightbox() { lb.classList.remove('open'); }
lb.addEventListener('click', closeLightbox);
$('lb-img').addEventListener('click', e => e.stopPropagation());
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
</script>
</body>
</html>
